apiVersion: v1
kind: Secret
metadata:
  name: logging-loki-s3
  namespace: openshift-logging
type: Opaque
stringData:
    bucketnames: "${BUCKET_NAME}"
    endpoint: "https://s3.openshift-storage.svc"
    access_key_id: "${AWS_ACCESS_KEY_ID}"
    access_key_secret: "${AWS_SECRET_ACCESS_KEY}"
    region: "us-east-1"
